name: Auto decide

"on":
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate decision and performance snapshot
        run: python scripts/algorithm.py
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add decision.json data/performance.json docs/performance.json docs/config.json
          git diff --cached --quiet || git commit -m "Update decision [automated]"
          git push
